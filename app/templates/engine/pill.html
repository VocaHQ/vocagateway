{# Header control: active model, network details on hover, opens Models on click. #}
<button type="button" id="engine-pill" class="{{ "engine-status ready" if engine.ready else "engine-status" }}"{% if oob %} hx-swap-oob="true"{% endif %}
        data-open-tab="models"
        aria-label="Speech model {{ label }}, {{ ready_label }}. Listener {{ listener }}. WebUI {{ local_url }}. Opens Models."
        hx-get="/ui/partials/engine-pill" hx-trigger="every 5s" hx-swap="outerHTML">
  <span class="dot {{ "ok" if engine.ready else "warn" }}" aria-hidden="true"></span>
  <span>{{ label }}</span>
  <span class="engine-status-hint" aria-hidden="true">Models</span>
  <span class="engine-popover" role="tooltip">
    <span class="engine-popover-card">
      <span class="engine-popover-title">{{ ready_label }}</span>
      <span class="engine-popover-row"><span>Listener</span><code>{{ listener }}</code></span>
      <span class="engine-popover-row"><span>This host</span><code>{{ local_url }}</code></span>
      <span class="engine-popover-hint">Click to open Models</span>
    </span>
  </span>
</button>
