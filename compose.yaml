name: vocagateway

services:
  gateway:
    image: ${VOCAGATEWAY_IMAGE:-vocaphone-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    network_mode: ${VOCAGATEWAY_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAGATEWAY_PUBLISH_HOST:-127.0.0.1}:${VOCAGATEWAY_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAGATEWAY_TOKEN_FILE: /run/secrets/vocagateway_token
      VOCAGATEWAY_DEBUG: ${VOCAGATEWAY_DEBUG:-false}
    secrets:
      - vocagateway_token
    volumes:
      - vocagateway-data:/data

  gateway-native:
    profiles: ["native"]
    image: vocaphone-gateway:native
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GGML_NATIVE: "ON"
    restart: unless-stopped
    init: true
    network_mode: ${VOCAGATEWAY_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAGATEWAY_PUBLISH_HOST:-127.0.0.1}:${VOCAGATEWAY_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAGATEWAY_TOKEN_FILE: /run/secrets/vocagateway_token
      VOCAGATEWAY_DEBUG: ${VOCAGATEWAY_DEBUG:-false}
    secrets: [vocagateway_token]
    volumes: [vocagateway-data:/data]

  gateway-cuda:
    profiles: ["cuda"]
    image: vocaphone-gateway:cuda
    build:
      context: .
      dockerfile: Dockerfile.cuda
    restart: unless-stopped
    init: true
    network_mode: ${VOCAGATEWAY_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAGATEWAY_PUBLISH_HOST:-127.0.0.1}:${VOCAGATEWAY_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAGATEWAY_TOKEN_FILE: /run/secrets/vocagateway_token
      VOCAGATEWAY_DEBUG: ${VOCAGATEWAY_DEBUG:-false}
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    secrets: [vocagateway_token]
    volumes: [vocagateway-data:/data]

  gateway-vulkan:
    profiles: ["vulkan"]
    image: vocaphone-gateway:vulkan
    build:
      context: .
      dockerfile: Dockerfile.vulkan
    restart: unless-stopped
    init: true
    network_mode: ${VOCAGATEWAY_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAGATEWAY_PUBLISH_HOST:-127.0.0.1}:${VOCAGATEWAY_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAGATEWAY_TOKEN_FILE: /run/secrets/vocagateway_token
      VOCAGATEWAY_DEBUG: ${VOCAGATEWAY_DEBUG:-false}
    devices:
      - /dev/dri:/dev/dri
    secrets: [vocagateway_token]
    volumes: [vocagateway-data:/data]

secrets:
  vocagateway_token:
    environment: VOCAGATEWAY_TOKEN

volumes:
  vocagateway-data:
